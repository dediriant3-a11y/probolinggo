<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Real-time HSI Probolinggo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes runBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .running-animation { animation: runBob 0.6s infinite ease-in-out; }

        @keyframes flagWave {
            0%, 100% { transform: rotate(0deg) skewY(0deg); }
            25% { transform: rotate(-5deg) skewY(-4deg); }
            75% { transform: rotate(5deg) skewY(4deg); }
        }
        .flag-wave {
            transform-origin: bottom left;
            animation: flagWave 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8 font-sans">

    <!-- Header dengan Logo Telkom (Tema Cerah) -->
    <header class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center border-b border-slate-200 pb-5 gap-4">
        <div class="flex items-center gap-4">
            <div class="bg-white p-2.5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-center">
                <img src="logo.png" 
                     alt="Telkom Indonesia" 
                     class="h-10 md:h-12 w-auto object-contain"
                     onerror="this.src='https://images.seeklogo.com/logo-png/38/2/telkom-indonesia-logo-png_seeklogo-384351.png'">
            </div>
            <div>
                <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight">
                    Dashboard HSI <span class="text-red-600">Probolinggo</span>
                </h1>
                <p class="text-slate-500 text-sm mt-1 flex items-center gap-2">
                    <span id="statusIndicator" class="inline-block w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="statusText">Menghubungkan ke Google Sheets...</span>
                </p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="fetchDataFromSheet()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 font-semibold text-xs px-4 py-2.5 rounded-xl transition flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-rotate text-blue-600"></i> Refresh Manual
            </button>
            <a href="https://docs.google.com/spreadsheets/d/1ixpWhHd5Vhwu89hAIMZkeHOjmXrHhCGuRz-HRlvbo9M/edit?usp=sharing" 
               target="_blank" 
               class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl transition duration-200 shadow-md flex items-center gap-2 text-sm">
                <i class="fa-solid fa-file-excel"></i> Buka Spreadsheet
            </a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto space-y-6">

        <!-- BANNER HITUNG MUNDUR -->
        <section class="bg-gradient-to-r from-red-600 to-rose-700 rounded-2xl p-5 shadow-lg text-white relative overflow-hidden">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white text-2xl">
                        <i class="fa-solid fa-hourglass-half animate-spin" style="animation-duration: 8s;"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            Peringatan Batas Waktu Target
                        </h2>
                        <p class="text-xs text-rose-100 mt-0.5">
                            Batas Akhir: <span id="deadlineDisplay" class="font-bold text-yellow-300">31 Oktober 2026, 23:59 WIB</span>
                        </p>
                    </div>
                </div>

                <!-- Digit Timer Display -->
                <div class="flex items-center gap-2 md:gap-3 text-center">
                    <div class="bg-white/10 border border-white/20 backdrop-blur-md rounded-xl px-3 py-2 min-w-[60px]">
                        <span id="timerDays" class="text-2xl md:text-3xl font-black text-white">00</span>
                        <p class="text-[10px] text-rose-200 uppercase tracking-wider font-semibold">Hari</p>
                    </div>
                    <span class="text-2xl font-bold text-white/60">:</span>
                    <div class="bg-white/10 border border-white/20 backdrop-blur-md rounded-xl px-
